; Firmware ESP32 báo cảnh báo. Build: `pio run`; test logic trên máy: `pio test -e native`.

[platformio]
default_envs = esp32dev

[env]
lib_deps = bblanchon/ArduinoJson@^7.4.2

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
build_flags = -Wall -Wextra

; Bản đo độ trễ: gửi echo seq của mỗi state lên node01/debug/latency (xem evaluation/tools/latency_echo.py). Không dùng khi vận hành.
[env:esp32dev_debug]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DRV_DEBUG_ECHO

; Chạy trên máy phát triển (cần g++ trong PATH), không cần mạch.
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
