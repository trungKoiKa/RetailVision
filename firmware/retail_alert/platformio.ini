; Firmware ESP32 báo cảnh báo. Build: `pio run`; test logic trên máy: `pio test -e native`.

[platformio]
default_envs = esp32dev

[env]
lib_deps = bblanchon/ArduinoJson@^7.4.2

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags = -Wall -Wextra

; Chạy trên máy phát triển (cần g++ trong PATH), không cần mạch.
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
