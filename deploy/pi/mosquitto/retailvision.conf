# Cấu hình Mosquitto cho RetailVision trên Raspberry Pi. Chép vào /etc/mosquitto/conf.d/retailvision.conf.
# Mosquitto của Debian/Raspberry Pi OS đã bật persistence và đặt persistence_location trong
# /etc/mosquitto/mosquitto.conf; khai báo lại ở đây sẽ báo trùng, nên không lặp lại.

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Giữ bản tin QoS 1 cho client cleanSession=false (backend) khi backend tắt.
autosave_interval 30
max_queued_messages 100000
max_queued_bytes 104857600
# state là QoS 0, không cần xếp hàng cho client đang offline.
queue_qos0_messages false
