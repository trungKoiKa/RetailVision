# Chép vào /etc/chrony/conf.d/retailvision.conf (Raspberry Pi OS Bookworm: chrony đọc thư mục này).
# Pi lấy giờ từ máy chủ LAN để chạy được khi không có Internet. Thay <IP-MAY-CHU> bằng IP thật.
#
# Với Raspberry Pi OS đang dùng systemd-timesyncd, cài chrony sẽ thay thế nó:
#   sudo apt install chrony

server <IP-MAY-CHU> iburst prefer
# Dự phòng khi có Internet
pool 2.debian.pool.ntp.org iburst
# Pi không có đồng hồ phần cứng: sau khi bật nguồn giờ có thể lệch rất xa, cho phép nhảy giờ 3 lần đầu
makestep 1.0 3
