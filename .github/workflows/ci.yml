name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract và định dạng JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0 referencing==0.37.0
      - name: Ví dụ hợp lệ qua, ví dụ sai bị từ chối
        run: python contracts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3 --check "**/*.json"

  edge:
    name: Edge (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edge/requirements-*.txt
      # mosquitto để chạy test tích hợp với broker thật (không có thì các test đó tự bỏ qua)
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: pip install -r edge/requirements-dev.txt
      - run: python -m pytest
        working-directory: edge

  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: mvn -B verify
        working-directory: backend

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    name: Firmware (test trên máy, build ESP32)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/retail_alert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      # secrets.h không nằm trong repo; dùng bản mẫu (giá trị giả) chỉ để biên dịch
      - run: cp include/secrets.example.h include/secrets.h
      - run: pio test -e native
      - run: pio run -e esp32dev
      - run: pio run -e esp32dev_debug

  deploy:
    name: Đóng gói máy chủ (Compose + Docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm cấu hình Compose
        run: docker compose --env-file deploy/server/.env.example -f deploy/server/compose.yaml -f deploy/server/compose.demo.yaml config -q
      - name: Kiểm cú pháp script
        run: bash -n deploy/server/scripts/backup.sh && bash -n deploy/server/scripts/restore.sh && bash -n deploy/pi/scripts/install_edge.sh && bash -n deploy/pi/scripts/check_clock.sh
      - name: Build ảnh
        run: docker compose --env-file deploy/server/.env.example -f deploy/server/compose.yaml -f deploy/server/compose.demo.yaml build
